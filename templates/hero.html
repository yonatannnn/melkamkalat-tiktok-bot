<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .header {
    top: 82px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 26px;
    color: var(--red); font-weight: 700;
  }
  .header .title { color: var(--ink); font-size: 46px; letter-spacing: 1px; }
  .header .rule { display: flex; align-items: center; width: 130px; }
  .header .rule span.line { flex: 1; height: 4px; background: var(--red); }
  .header .rule .diamond { width: 11px; height: 11px; flex: none; }

  .illus {
    left: 0; right: 0; bottom: 0; height: {{ illus_height }}px;
    background: url("{{ image }}") center bottom / cover no-repeat;
    mix-blend-mode: multiply;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 100%);
    filter: sepia(.25) contrast(1.05);
  }

  .quote {
    top: {{ text_top }}px; left: 70px; right: 70px; text-align: center;
    display: flex; flex-direction: column; align-items: center;
    text-shadow: 0 0 18px rgba(245,235,215,.9), 0 0 4px rgba(245,235,215,.9);
  }
  .line { font-size: {{ line_size }}px; font-weight: 700; line-height: 1.35; }
  .highlight { font-size: {{ highlight_size }}px; font-weight: 700; color: var(--red); line-height: 1.3; margin: 22px 0 18px; }
  .underline { width: 190px; height: 5px; background: var(--red); margin-top: 34px; border-radius: 3px; }
  .author { margin-top: 26px; font-size: 46px; font-weight: 700; color: var(--red); letter-spacing: .5px; }
</style></head>
<body>
  <div class="layer header">
    <div class="rule"><span class="diamond"></span><span class="line"></span></div>
    <div class="title">{{ brand }}</div>
    <div class="rule"><span class="line"></span><span class="diamond"></span></div>
  </div>

  {% if image %}<div class="layer illus"></div>{% endif %}

  <div class="layer quote">
    {% if line1 %}<div class="line">{{ line1 }}</div>{% endif %}
    <div class="highlight">{{ highlight }}</div>
    {% if line2 %}<div class="line">{{ line2 }}</div>{% endif %}
    <div class="underline"></div>
    {% if author %}<div class="author">— {{ author }}</div>{% endif %}
  </div>
</body></html>
