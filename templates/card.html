<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .portrait {
    top: 360px; left: 50%; transform: translateX(-50%); width: 640px; height: 580px;
    background: url("{{ image }}") center top / contain no-repeat;
    mix-blend-mode: multiply;
    -webkit-mask-image: radial-gradient(ellipse 50% 52% at 50% 46%, #000 55%, transparent 100%);
    filter: grayscale(.6) sepia(.3) contrast(1.1);
  }

  .card {
    top: {{ card_top }}px; left: 172px; right: 172px;
    padding: 46px 48px 44px;
    background: rgba(248,239,222,.88);
    border: 2px solid rgba(176,109,36,.22);
    border-radius: 26px;
    box-shadow: 0 10px 40px rgba(90,60,30,.18), inset 0 0 40px rgba(201,177,140,.25);
    text-align: center; color: var(--ink);
  }
  .orn { display: flex; align-items: center; gap: 14px; color: var(--gold); justify-content: center; }
  .orn .l { flex: 1; height: 2px; background: rgba(122,74,31,.45); }
  .orn .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
  .orn .diamond { width: 12px; height: 12px; }
  .q { position: absolute; font-size: 84px; color: var(--gold); font-family: Georgia, serif; line-height: 1; }
  .q.open { top: 22px; left: -40px; }
  .q.close { bottom: -6px; right: -40px; }

  .line1 { font-size: {{ line_size }}px; font-weight: 700; line-height: 1.35; margin-top: 30px; }
  .hl-wrap { display: flex; align-items: center; gap: 22px; margin: 8px 0 26px; }
  .hl-wrap .l { flex: 1; height: 2px; background: rgba(122,74,31,.45); margin-top: 30px; }
  .highlight { font-size: {{ highlight_size }}px; font-weight: 700; color: var(--gold); line-height: 1.3; position: relative; }
  .highlight .diamond { position: absolute; left: 50%; bottom: -6px; width: 11px; height: 11px; margin-left: -6px; color: var(--gold); }
  .sub { font-size: {{ sub_size }}px; font-weight: 700; line-height: 1.45; }
  .author { font-size: 42px; font-weight: 700; color: var(--gold); margin: -8px 0 26px; }
  .pill {
    margin: 36px 4px 34px; padding: 18px 26px; border-radius: 20px;
    background: linear-gradient(#83522a, #6c4019); color: #f6ead3;
    font-size: {{ cta_size }}px; font-weight: 400;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 4px 10px rgba(60,35,10,.25);
  }
</style></head>
<body>
  {% if image %}<div class="layer portrait"></div>{% endif %}

  <div class="layer card">
    <div class="q open">“</div>
    <div class="orn"><span class="l"></span><span class="diamond"></span><span class="l"></span></div>
    {% if line1 %}<div class="line1">{{ line1 }}</div>{% endif %}
    <div class="hl-wrap"><span class="l"></span>
      <div class="highlight">{{ highlight }}<span class="diamond"></span></div>
    <span class="l"></span></div>
    {% if sub %}<div class="sub">{{ sub | replace('\n', '<br>') | safe }}</div>{% endif %}
    {% if cta %}<div class="pill">{{ cta }}</div>{% endif %}
    {% if author %}<div class="author">— {{ author }}</div>{% endif %}
    <div class="orn" style="padding: 0 60px"><span class="l"></span><span class="dot"></span><span class="l"></span></div>
    <div class="q close">”</div>
  </div>
</body></html>
