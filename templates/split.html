<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { background: #f3efe7; color: #1d1a17; }
  body::after { display: none; }
  .text { top: 170px; left: 90px; right: 90px; text-align: center; }
  .q { font-size: {{ body_size }}px; font-weight: 700; line-height: 1.55; }
  .q .hl { color: var(--red); }
  .author { margin-top: 34px; font-size: 36px; color: #5b524a; }
  .rule { width: 220px; height: 2px; background: #b9ab98; margin: 30px auto 0; }
  .illus { left: 0; right: 0; bottom: 0; height: 1000px; background: url("{{ image }}") center top / cover no-repeat;
           -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 18%, #000 100%); }
  .brand { top: 70px; left: 50%; transform: translateX(-50%); padding: 8px 26px; background: #1d1a17; color: #f3efe7;
           border-radius: 8px; font-size: 26px; font-weight: 700; }
</style></head>
<body>
  <div class="layer brand">{{ brand }}</div>
  <div class="layer text">
    <div class="q">“{{ line1 }} <span class="hl">{{ highlight }}</span>{% if line2 %} {{ line2 }}{% endif %}{% if sub %} {{ sub | replace('\n', ' ') }}{% endif %}{% if cta %} {{ cta }}{% endif %}”</div>
    {% if author %}<div class="author">— {{ author }}</div>{% endif %}
    <div class="rule"></div>
  </div>
  {% if image %}<div class="layer illus"></div>{% endif %}
</body></html>
