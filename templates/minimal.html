<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  {% if theme == "dark" %}
  body { background: #050505; color: #f5f5f5; }
  body::before, body::after { display: none; }
  .hl { color: #fff; box-shadow: inset 0 -0.28em 0 #b8862b; }
  .author { color: #9a9a9a; }
  {% else %}
  body { background: #e9e7e3; color: #222; }
  body::after { display: none; }
  .hl { background: linear-gradient(transparent 12%, #b7e36b 12%, #b7e36b 88%, transparent 88%); padding: 0 .15em; }
  .author { color: #555; }
  {% endif %}
  .text { top: 0; bottom: 0; left: 100px; right: 100px; display: flex; flex-direction: column;
          justify-content: center; align-items: {{ 'center' if theme == 'dark' else 'flex-start' }};
          text-align: {{ 'center' if theme == 'dark' else 'left' }}; }
  .marks { font-size: 140px; line-height: .6; font-family: Georgia, serif; color: {{ '#b8862b' if theme == 'dark' else '#222' }}; margin-bottom: 30px; }
  .q { font-size: {{ body_size }}px; font-weight: 700; line-height: 1.6; }
  .author { margin-top: 44px; font-size: 38px; }
  .brand { bottom: 110px; right: 90px; font-size: 28px; font-weight: 700; opacity: .7; }
</style></head>
<body>
  <div class="layer text">
    <div class="marks">“</div>
    <div class="q">{{ line1 }} <span class="hl">{{ highlight }}</span>{% if line2 %} {{ line2 }}{% endif %}{% if sub %}<br>{{ sub | replace('\n', '<br>') | safe }}{% endif %}{% if cta %}<br>{{ cta }}{% endif %}</div>
    {% if author %}<div class="author">— {{ author }}</div>{% endif %}
  </div>
  <div class="layer brand">{{ brand }}</div>
</body></html>
