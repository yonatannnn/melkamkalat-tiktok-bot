<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { background: radial-gradient(ellipse at 50% 30%, #2a1f2e 0%, #120d14 55%, #08060a 100%); color: #f3ece2; }
  body::before, body::after { display: none; }
  .illus {
    top: 0; left: 0; right: 0; height: 1120px;
    background: url("{{ image }}") center / cover no-repeat;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 62%, transparent 100%);
  }
  .text { top: {{ 1080 if image else 640 }}px; left: 80px; right: 80px; text-align: center;
          display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .line { font-size: {{ line_size }}px; font-weight: 700; line-height: 1.4; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .highlight { font-size: {{ highlight_size }}px; font-weight: 700; line-height: 1.35; color: #e9b44c;
               text-shadow: 0 2px 16px rgba(0,0,0,.6); margin: 6px 0; }
  .author { margin-top: 26px; font-size: 34px; color: #b9ada0; }
  .rule { width: 160px; height: 3px; background: #e9b44c; margin-top: 20px; opacity: .8; }
  .brand { bottom: 120px; left: 50%; transform: translateX(-50%); padding: 14px 40px; border: 2px solid #e9b44c;
           border-radius: 40px; color: #e9b44c; font-size: 36px; font-weight: 700; }
</style></head>
<body>
  {% if image %}<div class="layer illus"></div>{% endif %}
  <div class="layer text">
    {% if line1 %}<div class="line">{{ line1 }}</div>{% endif %}
    <div class="highlight">{{ highlight }}</div>
    {% if line2 %}<div class="line">{{ line2 }}</div>{% endif %}
    {% if sub %}<div class="line">{{ sub | replace('\n', '<br>') | safe }}</div>{% endif %}
    {% if cta %}<div class="line">{{ cta }}</div>{% endif %}
    <div class="rule"></div>
    {% if author %}<div class="author">— {{ author }}</div>{% endif %}
  </div>
  <div class="layer brand">{{ brand }}</div>
</body></html>
