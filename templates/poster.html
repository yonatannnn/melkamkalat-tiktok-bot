<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { background: #1a1210; color: #fff; }
  body::before, body::after { display: none; }
  .illus { inset: 0; background: url("{{ image }}") center / cover no-repeat; }
  .shade { inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.15) 0%, rgba(0,0,0,.25) 35%,
           rgba(0,0,0,.72) 62%, rgba(0,0,0,.85) 100%); }
  .text { top: 1020px; left: 80px; right: 80px; text-align: center;
          display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .line { font-size: {{ line_size }}px; font-weight: 700; line-height: 1.4; text-shadow: 0 3px 14px rgba(0,0,0,.8); }
  .highlight { font-size: {{ highlight_size }}px; font-weight: 700; line-height: 1.3; color: #ffcf5a;
               text-shadow: 0 3px 18px rgba(0,0,0,.8); margin: 4px 0; }
  .author { margin-top: 24px; font-size: 36px; color: #e8dccb; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  .brand { bottom: 110px; right: 80px; padding: 12px 34px; background: rgba(0,0,0,.45); border: 2px solid rgba(255,207,90,.8);
           border-radius: 36px; color: #ffcf5a; font-size: 32px; font-weight: 700; }
</style></head>
<body>
  {% if image %}<div class="layer illus"></div>{% endif %}
  <div class="layer shade"></div>
  <div class="layer text">
    {% if line1 %}<div class="line">{{ line1 }}</div>{% endif %}
    <div class="highlight">{{ highlight }}</div>
    {% if line2 %}<div class="line">{{ line2 }}</div>{% endif %}
    {% if sub %}<div class="line">{{ sub | replace('\n', '<br>') | safe }}</div>{% endif %}
    {% if cta %}<div class="line">{{ cta }}</div>{% endif %}
    {% if author %}<div class="author">— {{ author }}</div>{% endif %}
  </div>
  <div class="layer brand">{{ brand }}</div>
</body></html>
